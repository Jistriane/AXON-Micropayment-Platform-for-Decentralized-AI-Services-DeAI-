version: "3.9"
services:
  gateway:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace services/gateway"
    environment:
      - PORT=8080
      - X402_EXPECTED_TOKEN=dev-x402-token
      - PLATFORM_FEE_BPS=500
      - STELLAR_NETWORK=testnet
    volumes:
      - ..:/workspace
    ports:
      - "8080:8080"

  web:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace apps/web"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://gateway:8080
    volumes:
      - ..:/workspace
    ports:
      - "3000:3000"
    depends_on:
      - gateway
